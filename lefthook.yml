pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    lint:
      run: pnpm lint
    steiger:
      run: pnpm steiger
    # --check, not --write: a hook that rewrites files would leave unstaged changes behind
    # after the push it just approved. Fails loudly instead; `pnpm format` is the fix.
    format:
      run: pnpm format:check
    test:
      run: pnpm test:run
