# Refuse any package published less than 14 days ago: freshly published releases are where
# compromised versions usually surface, before the registry pulls them.
minimumReleaseAge: 20160
# Exception, approved by hand: Next.js 16.3.8 is a security-only patch on the 16.3 line
# (SSRF in Image Optimization, metadata image route disclosure, cache poisoning).
minimumReleaseAgeExclude:
  - next@16.3.8
  - eslint-config-next@16.3.8
  - '@next/*'

# Install scripts stay blocked unless allowed here explicitly.
allowBuilds:
  # postinstall only runs `lefthook install`, which writes the git hooks.
  lefthook: true
  sharp: false
  unrs-resolver: false
